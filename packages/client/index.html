<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#181916" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="A focused workspace for the things worth keeping."
    />
    <title>Tearleads — Workspace</title>
    <script>
      // Applies the saved theme before first paint; mirrors src/theme.ts.
      (() => {
        let preference = null;
        try {
          preference = localStorage.getItem("tearleads.theme");
        } catch {
          // Storage can be unavailable in privacy-restricted browser contexts.
        }
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
